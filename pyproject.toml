[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bloodcell"
version = "0.1.0"
description = "Peripheral blood cell classification: PyTorch prototype to C++ edge inference"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = [
  "numpy>=2.0",
  "pillow>=10.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Pick exactly one torch build: `uv sync --extra cpu` (desktop, CI) or
# `uv sync --extra cu126` (laptop with an NVIDIA GPU).
cpu = ["torch>=2.6", "torchvision>=0.21"]
cu126 = ["torch>=2.6", "torchvision>=0.21"]
export = ["onnx>=1.17", "onnxruntime>=1.20"]

[project.scripts]
bloodcell-split = "bloodcell.data:main"
bloodcell-train = "bloodcell.train:main"
bloodcell-eval = "bloodcell.evaluate:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["bloodcell"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# scikit-learn and torchvision ship no type information
module = ["sklearn", "sklearn.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true
